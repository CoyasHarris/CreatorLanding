<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<style>
  :root {
    --accent: #ff9700;
    --accent-dim: #ff970022;
    --accent-border: #ff970044;
    --bg: #111111;
    --bg2: #181818;
    --bg3: #1e1e1e;
    --text: #e8e8e8;
    --muted: #888;
    --border: #242424;
    --radius: 16px;
    --font-display: 'LXGW WenKai TC', serif;
    /* candidates: 'Comfortaa', 'Oi', 'Shrikhand' */
    --font-body: 'Barlow', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.7; overflow-x: hidden; }

  /* LANG TOGGLE */
  .lang-toggle { display: flex; align-items: center; background: var(--bg3); border: 1px solid var(--border); border-radius: 50px; padding: 3px; gap: 2px; }
  .lang-btn { background: none; border: none; color: var(--muted); font-family: var(--font-body); font-size: 12px; font-weight: 700; letter-spacing: 1px; padding: 5px 12px; border-radius: 50px; cursor: pointer; transition: all .2s; }
  .lang-btn.active { background: var(--accent); color: #111; }
  .lang-btn:not(.active):hover { color: var(--text); }

  /* NAV */
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 10px 48px; background: rgba(17,17,17,0.88); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); transition: padding .3s; }
  .nav-logo { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -.5px; }
  .nav-logo span { color: var(--accent); }
  .nav-right { display: flex; align-items: center; gap: 20px; }
  .nav-links { display: flex; align-items: center; gap: 28px; }
  .nav-links a { font-size: 14px; color: var(--muted); text-decoration: none; transition: color .2s, transform .2s; display: inline-block; }
  .nav-links a:hover { color: var(--text); transform: translateY(-2px); }

  /* BUTTONS */
  .btn { display: inline-block; padding: 11px 26px; border-radius: 50px; font-family: var(--font-body); font-size: 14px; font-weight: 500; cursor: pointer; transition: all .2s; text-decoration: none; border: none; }
  .btn-primary { background: var(--accent); color: #111; font-weight: 700; }
  .btn-primary:hover { opacity: .85; transform: translateY(-1px); }
  .btn-ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent-border); }
  .btn-ghost:hover { background: var(--accent-dim); }
  .btn-app { background: #fff; color: #111; font-weight: 700; border: none; }
  .btn-app:hover { background: #e8e8e8; transform: translateY(-1px); }

  /* FLOATING BTN */
  .floating-btn { position: fixed; bottom: 32px; right: 32px; z-index: 200; background: #fff; color: #111; font-family: var(--font-body); font-size: 15px; font-weight: 700; padding: 14px 28px; border-radius: 50px; border: none; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 32px rgba(0,0,0,.5); transition: transform .2s, box-shadow .2s; opacity: 0; transform: translateY(16px); animation: floatIn .6s ease 1.4s forwards; }
  .floating-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,.6); }
  .floating-btn .dot-arrow { width: 26px; height: 26px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  @keyframes floatIn { to { opacity: 1; transform: translateY(0); } }
  @media (max-width: 480px) { .floating-btn span { display: none; } .floating-btn { padding: 14px; border-radius: 50%; bottom: 24px; right: 24px; } }

  /* HERO */
  .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 48px 80px; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 60% 50% at 50% 0%, #ff970012 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 20% 80%, #ff97000a 0%, transparent 60%); pointer-events: none; }
  .hero-grid { position: absolute; inset: 0; background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px); background-size: 60px 60px; opacity: .35; pointer-events: none; mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%); }
  .hero-tag { display: inline-flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--border); border-radius: 50px; padding: 6px 18px; font-size: 13px; color: var(--muted); margin-bottom: 32px; position: relative; z-index: 1; }
  .hero-tag .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(.8); } }
  .hero h1 { font-family: var(--font-display); font-size: clamp(56px, 9vw, 100px); font-weight: 700; color: #fff; line-height: 1.02; letter-spacing: -2px; margin-bottom: 24px; position: relative; z-index: 1; max-width: 960px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero > p { font-size: 18px; color: var(--muted); max-width: 540px; margin: 0 auto 40px; position: relative; z-index: 1; font-weight: 300; }
  .hero-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; position: relative; z-index: 1; margin-bottom: 60px; }
  .hero-btns .btn { font-size: 16px; padding: 14px 34px; }
  .hero-pills { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
  .hero-pill { background: var(--bg2); border: 1px solid var(--border); border-radius: 50px; padding: 8px 18px; font-size: 13px; color: var(--muted); }
  .hero-pill strong { color: var(--text); font-weight: 500; }

  /* SECTIONS */
  section { padding: 100px 48px; }
  .container { max-width: 960px; margin: 0 auto; }
  .section-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  .section-title { font-family: var(--font-display); font-size: clamp(36px, 5.5vw, 62px); font-weight: 700; color: #fff; line-height: 1.08; letter-spacing: -1px; margin-bottom: 16px; }
  .section-sub { font-size: 17px; color: var(--muted); max-width: 580px; font-weight: 300; line-height: 1.75; }
  .divider { border: none; border-top: 1px solid var(--border); }

  /* FEATURES */
  .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-top: 56px; padding: 4px; }
  .feature-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; transition: border-color .3s, transform .3s; position: relative; overflow: hidden; }
  .feature-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transition: transform .3s; transform-origin: left; }
  .feature-card:hover { border-color: #ff970055; transform: translateY(-2px); }
  .feature-card:hover::before { transform: scaleX(1); }

  /* SPOTLIGHT CARDS */
  /*.feature-card.spotlight { grid-column: 1 / -1; border-color: #ff970044; background: linear-gradient(160deg, #1e1a14 0%, var(--bg2) 60%); box-shadow: 0 0 48px rgba(255,151,0,.07); }*/
  .feature-card.spotlight {grid-column: 1 / -1;
    background:
            linear-gradient(
                    135deg,
                    rgba(255,151,0,.08) 0%,
                    rgba(255,151,0,.03) 30%,
                    #181818 100%
            );

    border: 1px solid rgba(255,151,0,.18);
  }
  .compare-spotlight {
    background:
            linear-gradient(
                    135deg,
                    rgba(0,140,255,.08),
                    #181818
            );
  }
  .rehearsal-spotlight {
    background:
            linear-gradient(
                    135deg,
                    rgba(255,151,0,.08),
                    #181818
            );
  }
  .cast-demo { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 20px; user-select: none; }
  .cast-listing-header { background: var(--bg); border: 1px solid var(--accent-border); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .cast-listing-label { display: block; font-size: 13px; color: var(--text); font-weight: 600; margin-bottom: 3px; }
  .cast-listing-meta { display: block; font-size: 11px; color: var(--muted); }
  .feature-card.spotlight::before { transform: scaleX(1); opacity: .6; }
  .feature-card.spotlight:hover { transform: translateY(-2px); border-color: #ff970077; }
  .spotlight-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-dim); border: 1px solid var(--accent-border); border-radius: 50px; padding: 4px 14px; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); margin-bottom: 20px; }
  .spotlight-body { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
  .spotlight-body .feature-icon { margin-bottom: 16px; }
  .spotlight-body h3 { font-size: 24px; margin-bottom: 12px; }
  .spotlight-body p { font-size: 15px; line-height: 1.7; }
  @media (max-width: 700px) { .spotlight-body { grid-template-columns: 1fr; } .spotlight-visual { display: none; } }

  /* Compare demo visual */
  .compare-demo { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 20px; user-select: none; }
  .demo-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .demo-pill { background: var(--accent-dim); border: 1px solid var(--accent-border); color: var(--accent); border-radius: 50px; padding: 5px 13px; font-size: 12px; font-weight: 600; }
  .demo-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .demo-card { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px 10px; text-align: center; }
  .demo-card .d-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--accent-dim); border: 1px solid var(--accent-border); margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--accent); }
  .demo-card .d-name { font-size: 12px; color: var(--text); font-weight: 600; margin-bottom: 2px; }
  .demo-card .d-tag { font-size: 11px; color: var(--muted); }
  .demo-next { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #111; border-radius: 50px; padding: 9px 0; font-size: 13px; font-weight: 700; width: 100%; }

  /* Rehearsal demo visual */
  .rehearsal-demo { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 20px; user-select: none; }
  .r-steps { display: flex; align-items: center; gap: 5px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .r-step { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #555; }
  .r-step.done { color: var(--accent); }
  .r-step .r-dot { width: 17px; height: 17px; border-radius: 50%; border: 1.5px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
  .r-step.done .r-dot { background: var(--accent-dim); }
  .r-step-sep { color: #2e2e2e; margin: 0 2px; }
  .r-chars { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .r-char { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 11px; color: var(--muted); }
  .r-char.active { border-color: var(--accent-border); background: var(--accent-dim); color: var(--accent); font-weight: 600; }
  .r-line { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }
  .r-line:last-child { margin-bottom: 0; }
  .r-who { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); min-width: 28px; padding-top: 4px; flex-shrink: 0; }
  .r-bubble { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--text); line-height: 1.5; }
  .r-bubble.ai { background: var(--accent-dim); border-color: var(--accent-border); }
  .r-cursor { display: inline-block; width: 2px; height: 13px; background: var(--accent); border-radius: 1px; animation: blink 1s infinite; vertical-align: middle; margin-left: 2px; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .r-whisper { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding-left: 38px; font-size: 11px; color: #555; font-style: italic; }
  .r-whisper::before { content: ''; display: inline-flex; gap: 2px; }
  .r-whisper-waves { display: flex; align-items: center; gap: 2px; }
  .r-whisper-waves span { display: block; width: 2px; background: var(--accent); border-radius: 2px; opacity: .5; animation: wave 1.2s ease-in-out infinite; }
  .r-whisper-waves span:nth-child(1) { height: 6px; animation-delay: 0s; }
  .r-whisper-waves span:nth-child(2) { height: 10px; animation-delay: .15s; }
  .r-whisper-waves span:nth-child(3) { height: 7px; animation-delay: .3s; }
  .r-whisper-waves span:nth-child(4) { height: 4px; animation-delay: .45s; }
  @keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(1.6)} }

  .feature-icon { width: 48px; height: 48px; background: var(--accent-dim); border: 1px solid var(--accent-border); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .feature-icon svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .feature-card h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 10px; letter-spacing: -0.5px; }
  .feature-card p { font-size: 14px; color: var(--muted); line-height: 1.65; }

  /* WHO / SWIPER */
  .who-section { background: var(--bg2); }
  .swiper { width: 100%; padding-bottom: 48px !important; }
  .swiper-slide { height: auto; }
  .who-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; height: 100%; }
  .who-badge { display: inline-block; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border); border-radius: 50px; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 5px 14px; margin-bottom: 20px; }
  .who-card h3 { font-family: var(--font-display); font-size: 30px; font-weight: 700; color: #fff; margin-bottom: 12px; letter-spacing: -0.5px; }
  .who-card .desc { font-size: 15px; color: var(--muted); font-weight: 300; margin-bottom: 24px; line-height: 1.7; }
  .who-tags { display: flex; flex-wrap: wrap; gap: 8px;}
  .who-tag { background: #242424; border: 1px solid var(--border); border-radius: 50px; font-size: 13px;  padding: 6px 14px; color:white;}
  .swiper-pagination-bullet { background: var(--border) !important; opacity: 1 !important; }
  .swiper-pagination-bullet-active { background: var(--accent) !important; width: 24px !important; border-radius: 4px !important; transition: width .3s !important; }

  /* STEPS */
  .steps { margin-top: 56px; }
  .step { display: flex; gap: 28px; padding: 32px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .step:last-child { border-bottom: none; }
  .step-num { flex-shrink: 0; width: 44px; height: 44px; background: var(--accent-dim); border: 1.5px solid var(--accent-border); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 20px; font-weight: 400; color: var(--accent); margin-top: 4px; letter-spacing: 1px; }
  .step-body h3 { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 8px; letter-spacing: -0.5px; }
  .step-body p { font-size: 15px; color: var(--muted); font-weight: 300; line-height: 1.7; }

  /* PRICING */
  .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 56px; align-items: start; }
  .pricing-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 40px 36px; }
  .pricing-card.featured { border: 2px solid var(--accent); position: relative; }
  .featured-badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #111; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 5px 18px; border-radius: 50px; white-space: nowrap; }
  .plan-name { font-family: var(--font-display); font-size: 16px; font-weight: 400; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .plan-price { font-family: var(--font-display); font-size: 60px; font-weight: 400; color: #fff; line-height: 1; letter-spacing: 2px; margin-bottom: 6px; }
  .plan-price.muted { color: #333; }
  .plan-price span { font-size: 18px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .plan-desc { font-size: 14px; color: var(--muted); margin-bottom: 28px; font-weight: 300; }
  .plan-features { list-style: none; margin-bottom: 32px; }
  .plan-features li { font-size: 14px; color: #aaa; padding: 9px 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  .plan-features li:last-child { border-bottom: none; }
  .plan-features li .check { color: var(--accent); font-weight: 700; flex-shrink: 0; font-size: 16px; }
  .plan-features li.dim { color: #444; }
  .plan-features li.dim .check { color: #333; }

  /* CTA */
  .cta-section { text-align: center; background: var(--bg2); position: relative; overflow: hidden; }
  .cta-section::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 60% 70% at 50% 50%, #ff970010 0%, transparent 70%); pointer-events: none; }
  .cta-section .container { position: relative; z-index: 1; }
  .cta-section .section-title { max-width: 640px; margin: 0 auto 16px; }
  .cta-section .section-sub { margin: 0 auto 40px; text-align: center; }
  .cta-btns { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .cta-btns .btn { font-size: 16px; padding: 15px 36px; }

  /* FOOTER */
  footer { background: #0d0d0d; border-top: 1px solid var(--border); padding: 48px; text-align: center; }
  .footer-logo { font-family: var(--font-display); font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 24px; display: block; text-decoration: none; }
  .footer-logo span { color: var(--accent); }
  .footer-links { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px; }
  .footer-links a { font-size: 13px; color: #555; text-decoration: none; transition: color .2s; }
  .footer-links a:hover { color: var(--accent); }
  .footer-copy { font-size: 13px; color: #444; }

  /* REVEAL & LANG FADE */
  .reveal { opacity: 0; transform: translateY(32px); }
  .lang-fade { transition: opacity .18s ease; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    nav { padding: 16px 20px; gap: 10px; }
    .nav-links { display: none; }
    .nav-right { gap: 10px; }
    section { padding: 72px 24px; }
    .hero { padding: 100px 24px 60px; }
    footer { padding: 40px 24px; }
  }
</style>
</head>

<nav>

let lang = localStorage.getItem('Creator_lang') || 'el';

function setLang(l) {
  lang = l;
  localStorage.setItem('Creator_lang', l);
  applyLang();
}

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('.lang-btn').forEach(btn => {
    const isEl = btn.textContent === 'ΕΛ';
    btn.classList.toggle('active', (lang === 'el' && isEl) || (lang === 'en' && !isEl));
  });

  document.querySelectorAll('.lang-fade').forEach(el => el.style.opacity = '0');

  setTimeout(() => {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t[el.getAttribute('data-i18n')];
      if (v !== undefined) el.textContent = v;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(el => {
      const v = t[el.getAttribute('data-i18n-html')];
      if (v !== undefined) el.innerHTML = v;
    });
    document.title = lang === 'el'
      ? 'Creator — Εδώ που οι δημιουργοί βρίσκουν τους δικούς τους'
      : 'Creator — Where Creative People Find Their People';
    document.querySelectorAll('.lang-fade').forEach(el => el.style.opacity = '1');
  }, 180);
}

applyLang();
